name: Archemedica Database OQ

on:
  push:
    paths:
      - 'db/migrations/**'
      - 'tests/db/ARC-PERSIST-OQ-002_gate.sh'
      - 'tests/db/ARC-PERSIST-OQ-002_gate_v1_1.sh'
      - '.github/workflows/archemedica-db-oq.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arc-persist-oq-002:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archemedica_oq
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d archemedica_oq"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: archemedica_oq
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout controlled configuration
        uses: actions/checkout@v4
      - name: Record OQ configuration
        run: |
          echo "ARC-PERSIST-OQ-002"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          psql --version
      - name: Apply controlled migrations
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find db/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying ${f}"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Execute ARC-PERSIST-OQ-002 gate v1.1
        shell: bash
        run: bash tests/db/ARC-PERSIST-OQ-002_gate_v1_1.sh
